<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Catálogo de Marcas</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background-color: #16324F;
    font-family: Arial, Helvetica, sans-serif;
}

/* CABECERA */
.cabecera {
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    /* Esto baja un poquito el título */
    padding-top: 12px;

    background: linear-gradient(135deg, #16324F, #1F4E68);

    border-bottom: 3px solid #D9B44A;
}

/* TÍTULO */
h1 {
    margin: 0;

    color: #ffffff;

    font-size: 27px;
    font-weight: 600;

    letter-spacing: 5px;

    text-align: center;
}

/* LÍNEA DECORATIVA */
.linea {
    width: 45px;
    height: 2px;

    background-color: #D9B44A;

    margin: 9px auto 0 auto;
}

</style>

</head>

<body>

<div class="cabecera">

    <div>
        <h1>CATÁLOGO DE MARCAS</h1>
        <div class="linea"></div>
    </div>

</div>

</body>

</html>
