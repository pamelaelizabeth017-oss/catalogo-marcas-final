
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tecnología - Catálogo de marcas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #f4f6f8;
    font-family: Arial, sans-serif;
    color: #142b46;
}

/* ENCABEZADO */
.encabezado {
    text-align: center;
    margin-bottom: 35px;
}

.encabezado h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.encabezado p {
    color: #64748b;
    font-size: 15px;
}

/* CUADRÍCULA */
.contenedor-marcas {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
    max-width: 1150px;
    margin: auto;
}

/* TARJETAS */
.tarjeta {
    background: white;
    border-radius: 15px;
    padding: 25px 15px;
    text-align: center;
    border-bottom: 3px solid #d9b547;

    box-shadow: 0 5px 18px rgba(0,0,0,0.07);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.tarjeta:hover {
    transform: translateY(-7px) scale(1.025);
    box-shadow: 0 16px 32px rgba(0,0,0,0.17);
}

/* IMÁGENES */
.tarjeta img {
    width: 100%;
    height: 110px;
    object-fit: contain;
    cursor: zoom-in;

    transition: transform 0.3s ease;
}

.tarjeta img:hover {
    transform: scale(1.08);
}

.tarjeta h3 {
    margin: 17px 0 12px;
    font-size: 17px;
}

/* BOTÓN CONOCER */
.boton-conocer {
    border: none;
    background: transparent;
    color: #b78319;
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: bold;
    cursor: pointer;
}

.boton-conocer:hover {
    color: #142b46;
}

/* VENTANAS MODALES */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,18,30,0.85);
    z-index: 1000;
    padding: 20px;
    align-items: center;
    justify-content: center;
}

.modal.visible {
    display: flex;
}

.modal-contenido {
    position: relative;
    background: white;
    border-radius: 17px;
    padding: 30px;
    width: min(90vw, 580px);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

.modal-contenido h2 {
    margin-top: 0;
    color: #142b46;
}

.modal-contenido p {
    line-height: 1.7;
    color: #475569;
}

.cerrar {
    position: absolute;
    right: 12px;
    top: 10px;
    border: none;
    background: #142b46;
    color: white;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 23px;
}

.cerrar:hover {
    background: #d9b547;
    color: #142b46;
}

/* LOGO AMPLIADO */
#imagen-grande {
    display: block;
    width: 100%;
    max-height: 55vh;
    object-fit: contain;
}

/* ADAPTACIÓN A PANTALLAS PEQUEÑAS */
@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .contenedor-marcas {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .tarjeta {
        padding: 15px 8px;
    }

    .tarjeta img {
        height: 85px;
    }
}
</style>
</head>

<body>

<header class="encabezado">
    <h1>TECNOLOGÍA</h1>
    <p>Explora las marcas y descubre su identidad visual.</p>
</header>

<main class="contenedor-marcas" id="marcas"></main>

<!-- VENTANA PARA AMPLIAR LOGOS -->
<div class="modal" id="modal-logo">
    <div class="modal-contenido">
        <button class="cerrar"
                onclick="cerrarModales()">×</button>

        <img id="imagen-grande"
             src=""
             alt="Logotipo ampliado">
    </div>
</div>

<!-- VENTANA CONOCER + -->
<div class="modal" id="modal-info">
    <div class="modal-contenido">
        <button class="cerrar"
                onclick="cerrarModales()">×</button>

        <h2 id="titulo-marca"></h2>
        <div id="texto-marca"></div>
    </div>
</div>

<script>
/* LAS DIEZ MARCAS DE TECNOLOGÍA */
const marcas = [
    {
        nombre: "Apple",
        imagen: "imagenes/apple.png",
        descripcion: "Apple es una empresa tecnológica fundada en 1976. Su identidad visual destaca por el símbolo de la manzana mordida, reconocido internacionalmente."
    },
    {
        nombre: "Samsung",
        imagen: "imagenes/samsung.png",
        descripcion: "Samsung es una marca surcoreana de tecnología. Su identidad visual utiliza un logotipo tipográfico que transmite modernidad y reconocimiento global."
    },
    {
        nombre: "Xiaomi",
        imagen: "imagenes/xiaomi.png",
        descripcion: "Xiaomi es una empresa china fundada en 2010. Su identidad utiliza el símbolo MI y el color naranja como elementos característicos."
    },
    {
        nombre: "Sony",
        imagen: "imagenes/sony.png",
        descripcion: "Sony es una empresa japonesa fundada en 1946. Su logotipo utiliza letras con serifas que refuerzan su identidad corporativa."
    },
    {
        nombre: "HP",
        imagen: "imagenes/hp.png",
        descripcion: "HP es una marca tecnológica estadounidense conocida por sus computadoras e impresoras. Su símbolo está formado por las iniciales de Hewlett-Packard."
    },
    {
        nombre: "Dell",
        imagen: "imagenes/dell.png",
        descripcion: "Dell es una empresa estadounidense fundada en 1984. Su identidad visual destaca por la letra E inclinada dentro de su logotipo."
    },
    {
        nombre: "Lenovo",
        imagen: "imagenes/lenovo.png",
        descripcion: "Lenovo es una empresa tecnológica de origen chino. Su identidad visual utiliza una tipografía sencilla y el color rojo."
    },
    {
        nombre: "ASUS",
        imagen: "imagenes/asus.png",
        descripcion: "ASUS es una marca tecnológica taiwanesa. Su logotipo presenta letras personalizadas que transmiten innovación."
    },
    {
        nombre: "Acer",
        imagen: "imagenes/acer.png",
        descripcion: "Acer es una empresa tecnológica taiwanesa. Su logotipo utiliza una tipografía moderna y el color verde."
    },
    {
        nombre: "Huawei",
        imagen: "imagenes/huawei.png",
        descripcion: "Huawei es una empresa china de tecnología. Su identidad visual combina un símbolo rojo de formas radiales con el nombre de la marca."
    }
];

const contenedor = document.getElementById("marcas");

/* CREAR LAS TARJETAS */
marcas.forEach((marca, indice) => {

    const tarjeta = document.createElement("article");
    tarjeta.className = "tarjeta";

    const imagen = document.createElement("img");
    imagen.src = marca.imagen;
    imagen.alt = "Logotipo de " + marca.nombre;
    imagen.tabIndex = 0;
    imagen.setAttribute("role", "button");
    imagen.setAttribute(
        "aria-label",
        "Ampliar logotipo de " + marca.nombre
    );

    imagen.addEventListener("click", () => {
        ampliarLogo(indice);
    });

    imagen.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter" ||
            evento.key === " ") {
            evento.preventDefault();
            ampliarLogo(indice);
        }
    });

    const titulo = document.createElement("h3");
    titulo.textContent = marca.nombre;

    const boton = document.createElement("button");
    boton.className = "boton-conocer";
    boton.textContent = "CONOCER +";

    boton.addEventListener("click", () => {
        mostrarInformacion(indice);
    });

    tarjeta.appendChild(imagen);
    tarjeta.appendChild(titulo);
    tarjeta.appendChild(boton);

    contenedor.appendChild(tarjeta);
});

/* AMPLIAR LOGOTIPO */
function ampliarLogo(indice) {
    const marca = marcas[indice];

    const imagenGrande =
        document.getElementById("imagen-grande");

    imagenGrande.src = marca.imagen;
    imagenGrande.alt =
        "Logotipo ampliado de " + marca.nombre;

    document.getElementById("modal-logo")
        .classList.add("visible");

    document.body.style.overflow = "hidden";
}

/* MOSTRAR INFORMACIÓN */
function mostrarInformacion(indice) {
    const marca = marcas[indice];

    document.getElementById("titulo-marca")
        .textContent = marca.nombre;

    document.getElementById("texto-marca")
        .textContent = marca.descripcion;

    document.getElementById("modal-info")
        .classList.add("visible");

    document.body.style.overflow = "hidden";
}

/* CERRAR VENTANAS */
function cerrarModales() {
    document.querySelectorAll(".modal")
        .forEach(modal => {
            modal.classList.remove("visible");
        });

    document.body.style.overflow = "";
}

/* CERRAR AL HACER CLIC FUERA */
document.querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener("click", evento => {
            if (evento.target === modal) {
                cerrarModales();
            }
        });
    });

/* CERRAR CON ESCAPE */
document.addEventListener("keydown", evento => {
    if (evento.key === "Escape") {
        cerrarModales();
    }
});
</script>

</body>
</html>
