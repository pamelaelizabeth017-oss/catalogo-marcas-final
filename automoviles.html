
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Automóviles - Catálogo de marcas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #f4f6f8;
    font-family: Arial, sans-serif;
    color: #142b46;
}

/* ENCABEZADO */
.encabezado {
    text-align: center;
    margin-bottom: 35px;
}

.encabezado h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.encabezado p {
    color: #64748b;
    font-size: 15px;
}

/* CUADRÍCULA DE MARCAS */
.contenedor-marcas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
    max-width: 1150px;
    margin: auto;
}

/* TARJETAS */
.tarjeta {
    position: relative;
    background: #ffffff;
    border-radius: 15px;
    padding: 25px 15px;
    text-align: center;
    border-bottom: 3px solid #d9b547;
    box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.tarjeta:hover {
    transform: translateY(-7px) scale(1.025);
    box-shadow: 0 16px 32px rgba(0,0,0,0.17);
    z-index: 2;
}

/* LOGOTIPOS */
.tarjeta img {
    width: 100%;
    height: 110px;
    object-fit: contain;
    cursor: zoom-in;
    transition: transform 0.3s ease;
}

.tarjeta img:hover {
    transform: scale(1.08);
}

.tarjeta h3 {
    margin: 17px 0 12px;
    font-size: 17px;
}

/* BOTÓN CONOCER + */
.boton-conocer {
    border: none;
    background: transparent;
    color: #b78319;
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: bold;
    cursor: pointer;
}

.boton-conocer:hover {
    color: #142b46;
}

/* VENTANAS MODALES */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,18,30,0.85);
    z-index: 1000;
    padding: 20px;
    align-items: center;
    justify-content: center;
}

.modal.visible {
    display: flex;
}

.modal-contenido {
    position: relative;
    background: #ffffff;
    border-radius: 17px;
    padding: 30px;
    width: min(90vw, 580px);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

.modal-contenido h2 {
    margin-top: 0;
    color: #142b46;
}

.modal-contenido p {
    line-height: 1.7;
    color: #475569;
}

/* BOTÓN CERRAR */
.cerrar {
    position: absolute;
    right: 12px;
    top: 10px;
    border: none;
    background: #142b46;
    color: #ffffff;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 23px;
}

.cerrar:hover {
    background: #d9b547;
    color: #142b46;
}

/* LOGO AMPLIADO */
#imagen-grande {
    display: block;
    width: 100%;
    max-height: 55vh;
    object-fit: contain;
}

/* DISEÑO RESPONSIVO */
@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .contenedor-marcas {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .tarjeta {
        padding: 15px 8px;
    }

    .tarjeta img {
        height: 85px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .tarjeta,
    .tarjeta img {
        transition: none;
    }
}
</style>
</head>

<body>

<header class="encabezado">
    <h1>AUTOMÓVILES</h1>
    <p>Explora las marcas de automóviles y descubre su identidad visual.</p>
</header>

<main class="contenedor-marcas" id="marcas"></main>

<!-- VENTANA PARA AMPLIAR LOGOTIPOS -->
<div class="modal" id="modal-logo"
     role="dialog"
     aria-modal="true"
     aria-label="Logotipo ampliado">

    <div class="modal-contenido">
        <button class="cerrar"
                type="button"
                onclick="cerrarModales()"
                aria-label="Cerrar imagen">×</button>

        <img id="imagen-grande"
             src=""
             alt="Logotipo ampliado">
    </div>
</div>

<!-- VENTANA CONOCER + -->
<div class="modal" id="modal-info"
     role="dialog"
     aria-modal="true"
     aria-label="Información de la marca">

    <div class="modal-contenido">
        <button class="cerrar"
                type="button"
                onclick="cerrarModales()"
                aria-label="Cerrar información">×</button>

        <h2 id="titulo-marca"></h2>
        <div id="texto-marca"></div>
    </div>
</div>

<script>
/* LAS DIEZ MARCAS DE AUTOMÓVILES */
const marcas = [
    {
        nombre: "Toyota",
        imagen: "imagenes/toyota.png",
        descripcion: "Toyota es una empresa automotriz japonesa fundada en 1937. Su identidad visual utiliza tres óvalos entrelazados, que forman un símbolo reconocible asociado con la marca y su presencia internacional."
    },
    {
        nombre: "Chevrolet",
        imagen: "imagenes/chevrolet.png",
        descripcion: "Chevrolet es una marca estadounidense fundada en 1911. Su identidad visual destaca por el emblema conocido como Bowtie, una figura geométrica semejante a una cruz horizontal."
    },
    {
        nombre: "Ford",
        imagen: "imagenes/ford.png",
        descripcion: "Ford es una empresa automotriz estadounidense fundada en 1903. Su logotipo utiliza una tipografía de estilo manuscrito dentro de un óvalo azul, una combinación que representa su tradición e identidad corporativa."
    },
    {
        nombre: "BMW",
        imagen: "imagenes/bmw.png",
        descripcion: "BMW es una marca alemana fundada en 1916. Su identidad visual destaca por un emblema circular con los colores azul y blanco, relacionados con la bandera de Baviera, región de origen de la empresa."
    },
    {
        nombre: "Mercedes-Benz",
        imagen: "imagenes/mercedesbenz.png",
        descripcion: "Mercedes-Benz es una marca alemana de automóviles. Su identidad visual utiliza una estrella de tres puntas dentro de un círculo, símbolo asociado con la presencia de sus motores en tierra, mar y aire."
    },
    {
        nombre: "Audi",
        imagen: "imagenes/audi.png",
        descripcion: "Audi es una marca alemana de automóviles. Su logotipo está formado por cuatro aros entrelazados, que representan la unión histórica de cuatro fabricantes de automóviles en Auto Union."
    },
    {
        nombre: "Nissan",
        imagen: "imagenes/nissan.png",
        descripcion: "Nissan es una empresa automotriz japonesa. Su identidad visual actual utiliza el nombre NISSAN integrado en un emblema circular de líneas sencillas, que transmite una imagen moderna."
    },
    {
        nombre: "Hyundai",
        imagen: "imagenes/hyundai.png",
        descripcion: "Hyundai es una marca automotriz surcoreana fundada en 1967. Su símbolo representa una letra H inclinada dentro de un óvalo y también se interpreta como dos personas estrechándose la mano."
    },
    {
        nombre: "Kia",
        imagen: "imagenes/kia.png",
        descripcion: "Kia es una marca automotriz surcoreana fundada en 1944. Su identidad visual actual utiliza letras estilizadas y conectadas que transmiten movimiento, innovación y modernidad."
    },
    {
        nombre: "Volkswagen",
        imagen: "imagenes/volkswagen.png",
        descripcion: "Volkswagen es una marca alemana fundada en 1937. Su símbolo combina las letras V y W dentro de un círculo, creando un monograma sencillo y fácilmente reconocible."
    }
];

const contenedor = document.getElementById("marcas");
let elementoAnterior = null;

/* CREAR LAS TARJETAS */
marcas.forEach((marca, indice) => {

    const tarjeta = document.createElement("article");
    tarjeta.className = "tarjeta";

    const imagen = document.createElement("img");
    imagen.src = marca.imagen;
    imagen.alt = "Logotipo de " + marca.nombre;
    imagen.tabIndex = 0;
    imagen.setAttribute("role", "button");
    imagen.setAttribute(
        "aria-label",
        "Ampliar logotipo de " + marca.nombre
    );

    imagen.addEventListener("click", () => {
        ampliarLogo(indice);
    });

    imagen.addEventListener("keydown", evento => {
        if (evento.key === "Enter" ||
            evento.key === " ") {
            evento.preventDefault();
            ampliarLogo(indice);
        }
    });

    const titulo = document.createElement("h3");
    titulo.textContent = marca.nombre;

    const boton = document.createElement("button");
    boton.className = "boton-conocer";
    boton.type = "button";
    boton.textContent = "CONOCER +";

    boton.addEventListener("click", () => {
        mostrarInformacion(indice);
    });

    tarjeta.appendChild(imagen);
    tarjeta.appendChild(titulo);
    tarjeta.appendChild(boton);

    contenedor.appendChild(tarjeta);
});

/* AMPLIAR LOGOTIPO */
function ampliarLogo(indice) {
    const marca = marcas[indice];

    elementoAnterior = document.activeElement;

    const imagenGrande =
        document.getElementById("imagen-grande");

    imagenGrande.src = marca.imagen;
    imagenGrande.alt =
        "Logotipo ampliado de " + marca.nombre;

    document.getElementById("modal-logo")
        .classList.add("visible");

    document.body.style.overflow = "hidden";

    document.querySelector("#modal-logo .cerrar").focus();
}

/* MOSTRAR INFORMACIÓN */
function mostrarInformacion(indice) {
    const marca = marcas[indice];

    elementoAnterior = document.activeElement;

    document.getElementById("titulo-marca")
        .textContent = marca.nombre;

    document.getElementById("texto-marca")
        .textContent = marca.descripcion;

    document.getElementById("modal-info")
        .classList.add("visible");

    document.body.style.overflow = "hidden";

    document.querySelector("#modal-info .cerrar").focus();
}

/* CERRAR VENTANAS */
function cerrarModales() {
    document.querySelectorAll(".modal")
        .forEach(modal => {
            modal.classList.remove("visible");
        });

    document.body.style.overflow = "";

    document.getElementById("imagen-grande")
        .removeAttribute("src");

    if (elementoAnterior) {
        elementoAnterior.focus();
    }
}

/* CERRAR AL HACER CLIC FUERA */
document.querySelectorAll(".modal")
    .forEach(modal => {
        modal.addEventListener("click", evento => {
            if (evento.target === modal) {
                cerrarModales();
            }
        });
    });

/* CERRAR CON ESCAPE */
document.addEventListener("keydown", evento => {
    if (evento.key === "Escape") {
        cerrarModales();
    }
});
</script>

</body>
</html>
